services:
  db:
    image: postgres:16
    container_name: jansahay-db-prod
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      timeout: 5s
      interval: 5s
      retries: 10

    volumes:
      - postgres_data_prod:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: jansahay-qdrant-prod
    restart: unless-stopped

    volumes:
      - qdrant_data_prod:/qdrant/storage

  neo4j:
    image: neo4j:5.18-community
    container_name: jansahay-neo4j-prod
    restart: unless-stopped

    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*

    volumes:
      - neo4j_data_prod:/data
      - neo4j_logs_prod:/logs

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    container_name: jansahay-backend-prod
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://jansahay:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}

      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}

      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-jansahay_documents}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}

      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}

      STT_PROVIDER: ${STT_PROVIDER:-gemini}
      TTS_PROVIDER: ${TTS_PROVIDER:-gtts}
      MAX_AUDIO_SIZE_MB: ${MAX_AUDIO_SIZE_MB:-10}

      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}

    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy

  

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ""
    container_name: jansahay-frontend-prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data_prod:
  qdrant_data_prod:
  neo4j_data_prod:
  neo4j_logs_prod: